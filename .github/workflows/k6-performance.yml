name: k6 performance test

on:
  workflow_dispatch:
    inputs:
      max_vus:
        description: 'Maximum virtual users (keep production tests gentle)'
        required: true
        type: choice
        default: '5'
        options:
          - '2'
          - '5'
          - '10'
      target_url:
        description: 'Target base URL'
        required: true
        type: choice
        default: 'https://foundationvne.com'
        options:
          - 'https://foundationvne.com'

permissions:
  contents: read

concurrency:
  group: k6-production-performance
  cancel-in-progress: false

jobs:
  load-test:
    name: Gentle production load test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare results directory
        run: mkdir -p results

      - name: Run k6
        env:
          MAX_VUS: ${{ inputs.max_vus }}
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env MAX_VUS \
            --env TARGET_URL \
            grafana/k6:0.56.0 run \
            --summary-export=/work/results/k6-summary.json \
            performance/foundationvne-load.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundationvne-k6-results-${{ github.run_id }}
          path: results/k6-summary.json
          if-no-files-found: warn
          retention-days: 14
