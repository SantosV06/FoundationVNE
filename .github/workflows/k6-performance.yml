name: k6 progressive capacity test

on:
  workflow_dispatch:
    inputs:
      confirm_production_test:
        description: 'Confirm that this run will generate real traffic to production (up to 100 VUs)'
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'
      target_url:
        description: 'Production target (fixed to the official site)'
        required: true
        type: choice
        default: 'https://foundationvne.com'
        options:
          - 'https://foundationvne.com'

permissions:
  contents: read

concurrency:
  group: k6-production-performance
  cancel-in-progress: false

jobs:
  load-test:
    name: Progressive production capacity test
    if: inputs.confirm_production_test == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare results directory
        run: mkdir -p results

      - name: Run progressive k6 test
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env TARGET_URL \
            grafana/k6:0.56.0 run \
            --summary-export=/work/results/k6-summary.json \
            performance/foundationvne-load.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundationvne-k6-capacity-results-${{ github.run_id }}
          path: results/k6-summary.json
          if-no-files-found: warn
          retention-days: 14
